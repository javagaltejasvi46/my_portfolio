# Render Blueprint configuration for Tejasvi Javagal Portfolio
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: tejasvi-portfolio
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: PORT
        value: "10000"
